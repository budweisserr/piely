name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build whisper.cpp
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build --config Release

      - name: Stage whisper-cli for bundling
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          if [ -f whisper.cpp/build/bin/Release/whisper-cli.exe ]; then
            cp whisper.cpp/build/bin/Release/whisper-cli.exe "src-tauri/binaries/whisper-cli-$TRIPLE.exe"
          else
            cp whisper.cpp/build/bin/whisper-cli "src-tauri/binaries/whisper-cli-$TRIPLE"
          fi

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Piely ${{ github.ref_name }}"
          releaseBody: |
            Installers for macOS, Windows, and Linux.

            - First launch runs the setup wizard: connect an AI provider (pi login) and a voice backend.
            - Documentation: https://github.com/budweisserr/piely/wiki
            - Local speech-to-text (whisper.cpp) is bundled; set the STT provider's `MODEL_PATH` to a ggml model file.
          releaseDraft: true
          prerelease: false
