name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libpulse-dev \
            libfuse2 \
            desktop-file-utils \
            squashfs-tools \
            zsync

      - name: Install frontend dependencies
        run: npm install

      - name: Build whisper.cpp
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build --config Release

      - name: Compile pi sidecar (bun)
        run: |
          bun install --cwd piely-agent
          bun build --compile piely-agent/agent.mjs --outfile piely-agent/bin/piely-agent

      - name: Stage sidecars for bundling
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          if [ -f whisper.cpp/build/bin/Release/whisper-cli.exe ]; then
            cp whisper.cpp/build/bin/Release/whisper-cli.exe "src-tauri/binaries/whisper-cli-$TRIPLE.exe"
          else
            cp whisper.cpp/build/bin/whisper-cli "src-tauri/binaries/whisper-cli-$TRIPLE"
          fi
          if [ -f piely-agent/bin/piely-agent.exe ]; then
            cp piely-agent/bin/piely-agent.exe "src-tauri/binaries/piely-agent-$TRIPLE.exe"
          else
            cp piely-agent/bin/piely-agent "src-tauri/binaries/piely-agent-$TRIPLE"
          fi

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy can't mount AppImages (no FUSE on GH runners); extract instead
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy's bundled strip (old binutils) chokes on .relr.dyn sections
          # in modern distro libs -> skip stripping ("unknown type [0x13] section .relr.dyn")
          NO_STRIP: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Piely ${{ github.ref_name }}"
          releaseBody: |
            Installers for macOS, Windows, and Linux. Everything is bundled — no extra steps after install.

            - First launch runs the setup wizard: connect an AI provider (pi login) and a voice backend.
            - The pi sidecar is compiled into the app (no Node.js needed).
            - Local speech-to-text (whisper.cpp) is bundled; set the STT provider's `MODEL_PATH` to a ggml model file.
            - Documentation: https://github.com/budweisserr/piely/wiki
          releaseDraft: true
          prerelease: false
