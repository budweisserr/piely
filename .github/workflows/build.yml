name: Build

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpulse-dev

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Verify frontend
        run: npm --prefix frontend test

      - name: Verify Rust units
        run: cargo test --lib
        working-directory: backend

      - name: Build whisper.cpp
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper.cpp/build --config Release

      - name: Compile pi sidecar (bun)
        shell: bash
        run: |
          bun install --cwd piely-agent
          # Bundle to a single file first: bun 1.3.x --compile of the multi-module
          # pi-ai graph produces an executable that segfaults at startup (embedded
          # graph corruption); compiling the bundle avoids it.
          bun build piely-agent/agent.mjs --target=bun --outfile /tmp/piely-agent.bundle.mjs
          bun build --compile /tmp/piely-agent.bundle.mjs --outfile piely-agent/bin/piely-agent
          # tauri bundles this as a resource under the plain name; bun appends .exe on Windows
          if [ -f piely-agent/bin/piely-agent.exe ]; then mv piely-agent/bin/piely-agent.exe piely-agent/bin/piely-agent; fi

      - name: Verify pi sidecar
        shell: bash
        run: |
          (cd piely-agent && npm test)

      - name: Verify compiled pi sidecar
        # Runs the self check inside the compiled binary: this is what catches a
        # bundle that is missing pi-ai's OAuth flows (they are hidden from
        # bundlers, so the dynamic import cannot resolve in a binary). Runs on
        # every platform: a Windows-only import failure shipped once already.
        shell: bash
        run: ./piely-agent/bin/piely-agent --selfcheck

      - name: Stage sidecars for bundling
        shell: bash
        run: |
          mkdir -p backend/binaries
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          if [ -f whisper.cpp/build/bin/Release/whisper-cli.exe ]; then
            cp whisper.cpp/build/bin/Release/whisper-cli.exe "backend/binaries/whisper-cli-$TRIPLE.exe"
          else
            cp whisper.cpp/build/bin/whisper-cli "backend/binaries/whisper-cli-$TRIPLE"
          fi


      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy can't mount AppImages (no FUSE on GH runners); extract instead
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy's bundled strip (old binutils) chokes on .relr.dyn sections
          # in modern distro libs -> skip stripping ("unknown type [0x13] section .relr.dyn")
          NO_STRIP: "1"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: piely-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            backend/target/release/bundle/**/*.dmg
            backend/target/release/bundle/**/*.msi
            backend/target/release/bundle/**/*.exe
            backend/target/release/bundle/**/*.deb
            backend/target/release/bundle/**/*.rpm
            backend/target/release/bundle/**/*.AppImage
