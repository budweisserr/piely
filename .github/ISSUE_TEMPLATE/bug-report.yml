name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Before submitting:
        - Search for an existing issue first.
        - One issue per problem.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which operating system are you using?
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Piely version
      description: What version of Piely are you using?
      placeholder: "e.g., 0.1.9"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Describe the bug. Include the exact steps that trigger it and any error output.
      placeholder: "1. I opened the overlay and typed... 2. ... 3. The result was..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that helps reproduce the problem. This is optional but often speeds up the fix.
