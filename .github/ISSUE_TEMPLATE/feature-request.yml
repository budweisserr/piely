name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

        Before submitting:
        - Search for an existing feature request first.
        - Understand this is a suggestion; it may not be implemented.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today? Describe the situation where this feature would help.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the feature work? Be specific about the behavior you expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Any workarounds or other approaches. This is optional.
