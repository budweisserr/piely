name: General Issue
description: Questions, discussions, or anything that does not fit the other templates
title: "[GENERAL] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## General Issue

        Before submitting:
        - Read the README and the [wiki](https://github.com/budweisserr/piely/wiki) first.
        - Search for an existing issue covering the same topic.

  - type: textarea
    id: description
    attributes:
      label: What is it about
      description: State your question or the topic you want to discuss clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Anything relevant that helps understand the question. This is optional.
